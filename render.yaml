##########################################################################
# render.yaml — DebateForge Infrastructure Blueprint
# Deploy all services at once via Render's "Blueprint" feature.
# Docs: https://render.com/docs/blueprint-spec
##########################################################################

services:
  # ────────────────────────────────────────────
  # 1. BACKEND — Node.js / Express / Socket.IO
  # ────────────────────────────────────────────
  - type: web
    name: debateforge-backend
    runtime: node
    region: oregon
    plan: free              # upgrade to 'starter' ($7/mo) for always-on
    rootDir: backend
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Secrets — set these manually in the Render dashboard ──
      - key: MONGODB_URI
        sync: false         # prompted on first deploy
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # ── Resend (HTTP email API — bypasses Render SMTP block) ──
      - key: RESEND_API_KEY
        sync: false         # get key at https://resend.com/api-keys
      # ── Groq LLM keys (up to 8, auto-rotated) ──
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_API_KEY_5
        sync: false
      - key: GROQ_API_KEY_6
        sync: false
      - key: GROQ_API_KEY_7
        sync: false
      - key: GROQ_API_KEY_8
        sync: false
      # ── Sarvam AI keys (Indian languages, up to 8) ──
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY_2
        sync: false
      - key: SARVAM_API_KEY_3
        sync: false
      - key: SARVAM_API_KEY_4
        sync: false
      - key: SARVAM_API_KEY_5
        sync: false
      - key: SARVAM_API_KEY_6
        sync: false
      - key: SARVAM_API_KEY_7
        sync: false
      - key: SARVAM_API_KEY_8
        sync: false
      # ── Push Notifications (VAPID) ──
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
      # ── Cross-service URLs (fill in after ML + Frontend are deployed) ──
      - key: FRONTEND_URL
        sync: false         # e.g. https://debateforge.vercel.app
      - key: ML_SERVICE_URL
        sync: false         # e.g. https://debateforge-ml.onrender.com

  # ────────────────────────────────────────────
  # 2. ML SERVICE — Python / FastAPI / uvicorn
  # ────────────────────────────────────────────
  - type: web
    name: debateforge-ml
    runtime: python
    region: oregon
    plan: free              # upgrade to 'starter' if SentenceTransformer OOMs
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false         # e.g. https://debateforge.vercel.app
      # Disable heavy local models on free tier to stay within 512 MB RAM
      - key: USE_LOCAL_STT
        value: "false"
      - key: USE_LOCAL_TTS
        value: "false"
      - key: USE_LOCAL_MEMORY
        value: "false"
