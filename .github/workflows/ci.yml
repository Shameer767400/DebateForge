# ═══════════════════════════════════════════════════════════
# DebateForge CI Pipeline
# Runs on push to main and on pull requests.
# Tests backend (Jest), validates ML service (Python),
# builds frontend, and runs security scans.
# ═══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Security: Detect hardcoded secrets ──
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate scanning

      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── Backend Tests (Node.js + Jest) ──
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: false

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-for-ci-pipeline-minimum-32-chars

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

  # ── ML Service Validation (Python) ──
  ml-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ml

      - name: Validate FastAPI app loads
        run: python -c "from main import app; print('✅ ML app loaded successfully')"
        working-directory: ml

  # ── Frontend Build Check ──
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true  # frontend has more transitive deps, warn only

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Vite uses VITE_ prefix (not REACT_APP_)
          VITE_API_URL: http://localhost:5001

