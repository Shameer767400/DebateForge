<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Primary SEO -->
    <title>DebateForge — AI-Powered Debate Practice Platform</title>
    <meta name="description" content="Practice debates against AI opponents that adapt to your style. Get real-time fallacy detection, scoring, and analytics. Free to start." />
    <meta name="keywords" content="debate practice, AI debate, debate training, public speaking, fallacy detection, debate coach, online debate, debate competition, law school prep, GD preparation" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://debateforge.tech/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://debateforge.tech/" />
    <meta property="og:site_name" content="DebateForge" />
    <meta property="og:title" content="DebateForge — Sharpen Your Debate Skills with AI" />
    <meta property="og:description" content="Practice debates against AI opponents that adapt to your style. Get real-time fallacy detection, scoring, and analytics. Free to start." />
    <meta property="og:image" content="https://debateforge.tech/logo512.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@debateforge" />
    <meta name="twitter:title" content="DebateForge — Sharpen Your Debate Skills with AI" />
    <meta name="twitter:description" content="Practice debates against AI opponents that adapt to your style. Get real-time fallacy detection, scoring, and analytics. Free to start." />
    <meta name="twitter:image" content="https://debateforge.tech/logo512.png" />

    <!-- App Icons -->
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DebateForge",
        "url": "https://debateforge.tech",
        "logo": "https://debateforge.tech/logo512.png",
        "description": "Practice debates against AI opponents that adapt to your style. Get real-time fallacy detection, scoring, and analytics."
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DebateForge",
        "url": "https://debateforge.tech",
        "description": "AI-Powered Debate Practice Platform",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://debateforge.tech/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
    </script>

    <!-- Fonts — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
